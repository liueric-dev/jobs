# Postgres + PostGIS backing both pipelines (public.events, jobs.jobs).
#
# The password is NOT stored here. It lives in ~/.hermes/.env alongside
# DATABASE_URL and the API keys, because this file is tracked in git and the
# repository is cloned to several machines -- a credential committed here is
# a credential on every one of them and in the hosting provider's history.
#
#   docker compose --env-file ~/.hermes/.env up -d
#
# POSTGRES_PASSWORD must be set in that env file and must match the password
# inside DATABASE_URL. The `:?` form below fails fast with the message shown
# rather than silently starting a database with an empty password.
#
# NOTE ON MULTI-DEVICE ACCESS: the port below is published on localhost only.
# Other machines running the jobs pipeline cannot reach this database as
# configured -- see DATABASE.md for the options.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nyc-events-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyc_events}
      POSTGRES_USER: ${POSTGRES_USER:-nyc_events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ~/.hermes/.env}
    ports:
      # Localhost only. This was previously "5432:5432", which binds every
      # interface and exposes Postgres to the whole network.
      # For multi-device access, widen this deliberately -- and read
      # DATABASE.md first, because a network-reachable Postgres wants TLS
      # and a firewall rule, not just an open port.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyc_events} -d ${POSTGRES_DB:-nyc_events}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

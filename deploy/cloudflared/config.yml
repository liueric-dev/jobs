# cloudflared ingress for bankan, a separate application.
#
# TEMPLATE. Every ANGLE-BRACKETED value below is the owner's to fill in and none
# of them can be filled in from this repository -- they come from a Cloudflare
# account, a domain, and one `cloudflared tunnel create`. See deploy/README.md
# for the exact command sequence.
#
# WHY A TUNNEL AND NOT A FORWARDED PORT. It solves four problems at once and
# costs nothing: no static IP, no inbound port open on the home router, TLS
# terminated at Cloudflare's edge with a real certificate, and it works from
# behind a residential ISP that blocks inbound servers. The alternative --
# forward 443, run certbot, hope the ISP allows it, hope the dynamic IP holds --
# has four failure modes where this has one.
#
# WHAT THIS DOES NOT DO, said plainly because it is easy to assume otherwise:
# the tunnel authenticates the ORIGIN to Cloudflare, not the USER to the app.
# Anyone on the internet can reach the hostname below. A tunnel is not an
# authorization layer and must never be treated as one.
#
# INSTALL: this file is the tracked copy. cloudflared reads
# ~/.cloudflared/config.yml, so symlink rather than copy -- a copy drifts from
# the repo silently, which is the failure this whole tranche is about:
#
#     ln -s ~/apps/jobs/deploy/cloudflared/config.yml ~/.cloudflared/config.yml
#     cloudflared tunnel ingress validate    # parses this file, no traffic
#     cloudflared tunnel ingress rule https://bankan.etotheric.com/

tunnel: 726fa841-8945-4e06-bb06-f241cbbe30dc

# Written by `cloudflared tunnel create`, NOT by this repo, and never copied
# into it: it is a bearer credential for the tunnel -- whoever holds it can
# receive traffic for the hostnames below. .gitignore covers deploy/**/*.json
# so that a copy made "just to test" cannot be committed.
credentials-file: /home/eric/.cloudflared/726fa841-8945-4e06-bb06-f241cbbe30dc.json

originRequest:
  connectTimeout: 10s
  noTLSVerify: false

ingress:
  # ---- bankan: separate app, separate systemd unit, separate Postgres role -
  #
  # Port 3011 matches bankan's systemd unit in a sibling repo. Shared tunnel,
  # nothing more.
  - hostname: bankan.etotheric.com
    service: http://localhost:3011

  # Required terminator. cloudflared refuses to start without a catch-all, and
  # 404 rather than a default backend is deliberate: a hostname added to the
  # Cloudflare dashboard but not to this file must fail visibly, not land on
  # whichever service happens to be listed first.
  - service: http_status:404

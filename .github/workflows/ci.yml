# CI for the pipeline, services, frontend, lint, and types.
# The pipeline suite must not skip database tests when Postgres is unavailable.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    name: Three suites
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobs_ci
          POSTGRES_PASSWORD: jobs_ci
          POSTGRES_DB: jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # scratchdb.scratch_url() reads this first, DATABASE_URL second, so the
      # DB-gated modules run without a backend/.env existing in the checkout.
      JOBS_SCRATCH_DATABASE_URL: postgresql://jobs_test:jobs_test@localhost:5432/jobs_test_db
      DATABASE_URL: postgresql://jobs_test:jobs_test@localhost:5432/jobs_test_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Pipeline dependencies are separate from the webapp and API.
      - name: Pipeline deps
        run: pip install -r backend/requirements.txt

      # Privilege tests must run as a regular role: a superuser has every
      # privilege even after REVOKE, so those tests cannot make their assertion.
      - name: Create test database and role
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://jobs_ci:jobs_ci@localhost:5432/jobs",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE ROLE jobs_test LOGIN PASSWORD 'jobs_test'")
              conn.execute("CREATE DATABASE jobs_test_db OWNER jobs_test")
          PY

      # Provision the same schema the three application components use.
      - name: Provision public from nothing
        working-directory: backend
        run: python tools/provision-database.py

      - name: Pipeline suite
        working-directory: backend
        run: python -m unittest discover -s tests -v 2>&1 | tee /tmp/pipeline.log

      # Zero skipped is the current local state and it is load-bearing: a skip
      # here means Postgres was unreachable and twelve modules passed
      # vacuously. unittest prints the (skipped=N) suffix only when non-zero.
      - name: No test may skip
        run: |
          if grep -q "skipped=" /tmp/pipeline.log; then
            echo "::error::pipeline suite skipped tests -- Postgres unreachable?"
            grep "skipped=" /tmp/pipeline.log
            exit 1
          fi

      # webapp/ and api/ set include-system-site-packages = false and are built
      # from their own requirements.txt. They are the second and third suites,
      # not part of the first.
      - name: webapp suite
        working-directory: backend/webapp
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests

      - name: api suite
        working-directory: backend/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests

  checkers:
    name: Checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No build step, no npm, no package.json -- and that is a constraint to
      # keep. check_client.mjs runs on plain node against the shipped fixtures.
      - name: Frontend fixtures still describe the server
        run: python frontend/verify_fixtures.py

      - name: Client still agrees with the fixtures
        run: node frontend/check_client.mjs

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      # NON-BLOCKING BY DESIGN, and this is the whole shape of T-1. The first
      # baseline is 1076 findings across a tree written without a linter.
      # Failing the build on it would mean either a single unreviewable
      # 1076-finding sweep -- the exact move that produced the 42,777 lines of
      # Markdown deleted on 2026-08-02 -- or turning the rules off until it
      # passes. Neither is the point. The count comes down one rule per commit,
      # and this step flips to blocking when it reaches zero. Until then it is
      # a number on every run, which is more than the repo had.
      - name: ruff baseline
        working-directory: backend
        continue-on-error: true
        run: ruff check . --statistics

      - name: ruff config is not a runtime dependency
        run: |
          if grep -rn "ruff" backend/requirements.txt backend/api/requirements.txt backend/webapp/requirements.txt; then
            echo "::error::ruff is a dev tool and must not be a runtime dependency"
            exit 1
          fi

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # psycopg is installed so mypy can resolve its inline types (py.typed) for
      # the seam files' `conn: psycopg.Connection` annotations -- a dev-venv
      # concern, not a second runtime dependency. Pinned to match
      # backend/requirements.txt (T-3) rather than floating.
      - name: Install mypy
        run: pip install mypy 'psycopg[binary]==3.3.4'

      # BLOCKING, unlike ruff's baseline. T-17 scoped `[tool.mypy]`'s `files` to
      # exactly backend/lib/, schema.py and match.py's score_job() -- the
      # boundaries the row names -- and typed only that closed list, so there is
      # no untyped backlog here to land against gradually the way ruff's 1076
      # findings were. A clean run is the acceptance criterion T-17 states, not
      # a number that comes down over time.
      - name: mypy on the typed seams
        working-directory: backend
        run: mypy

      - name: mypy config is not a runtime dependency
        run: |
          if grep -rn "mypy" backend/requirements.txt backend/api/requirements.txt backend/webapp/requirements.txt; then
            echo "::error::mypy is a dev tool and must not be a runtime dependency"
            exit 1
          fi

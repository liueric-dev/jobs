name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobs_ci
          POSTGRES_PASSWORD: jobs_ci
          POSTGRES_DB: jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBS_SCRATCH_DATABASE_URL: postgresql://jobs_test:jobs_test@localhost:5432/jobs_test_db
      DATABASE_URL: postgresql://jobs_test:jobs_test@localhost:5432/jobs_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements.txt
      - name: Create disposable test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://jobs_ci:jobs_ci@localhost:5432/jobs", autocommit=True) as conn:
              conn.execute("CREATE ROLE jobs_test LOGIN PASSWORD 'jobs_test'")
              conn.execute("CREATE DATABASE jobs_test_db OWNER jobs_test")
          PY
      - name: Provision ingestion schema
        working-directory: backend
        run: python tools/provision-database.py
      - name: Full suite
        working-directory: backend
        run: python -m unittest discover -s tests -v 2>&1 | tee /tmp/pipeline.log
      - name: Require database tests to run
        run: |
          if grep -q "skipped=" /tmp/pipeline.log; then
            echo "::error::pipeline suite skipped tests"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - name: Ruff baseline (existing backlog)
        working-directory: backend
        continue-on-error: true
        run: ruff check . --statistics

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install mypy 'psycopg[binary]==3.3.4'
      - name: Typed seams
        working-directory: backend
        run: mypy

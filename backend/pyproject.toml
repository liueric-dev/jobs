# Development-only lint and type-check configuration. The application is not
# installed as a Python package; each component uses its own environment.

[tool.ruff]
target-version = "py314"
line-length = 100

# Ruff's own defaults are NOT relied on. As of 0.16 the default select is far
# wider than the documented E4/E7/E9/F, so a ruff upgrade would silently move
# the baseline -- which is the same class of drift this repo just spent four
# commits undoing. Selection is explicit below and pinned by CI.
extend-exclude = [
    ".venv",
    ".venv-dev",
    # Recorded third-party responses are not source code.
    "testsupport/fixtures",
]

[tool.ruff.lint]
# Landed against a RECORDED BASELINE, not a mass reformat. A large unreviewable
# diff is the exact move that produced the 42,777 lines of Markdown deleted on
# 2026-08-02. The baseline is in the commit that adds this file; the direction is
# down, and the way down is one rule per commit.
select = [
    "F",      # pyflakes -- real errors: undefined names, unused imports
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "B",      # bugbear
    "C4",     # comprehensions
    "UP",     # pyupgrade
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "BLE",    # blind-except -- see T-11; this repo's failure mode is silence
    "S",      # bandit. S608 is the f-string-SQL rule T-16 is about
    "PIE",
    "RET",
    "ARG",
    "DTZ",
]

# RUF100 (unused-noqa) is the largest single line item in the first baseline and
# it is the most instructive one, so it stays selected rather than being hidden:
#
#   .venv-dev/bin/ruff check . --select E402            -> 0 findings
#   .venv-dev/bin/ruff check . --output-format concise | grep -c 'unused: `E402`'
#                                                       -> 301
#
# 301 `# noqa: E402` directives were written by hand, across the tree, for a
# linter that was never run -- suppressing a finding ruff does not make. Whether
# flake8 would have made it is unknown and this repo cannot claim either way,
# because nothing ever checked. That is the whole thesis in one rule: the
# convention was performed and the check behind it never existed.
#
# DO NOT `--fix` these. It is a 301-line diff with no behaviour change, and the
# directives may well be correct for pycodestyle even though they are inert for
# ruff. They come out, if they come out, as their own commit with that question
# answered first.

ignore = [
    # Line length is reported by W505/E501 against a 100-column limit that most
    # of this tree predates. Formatting is a separate commit from linting; until
    # `ruff format` is run, E501 is noise that hides the findings that matter.
    "E501",
    # This repo prints. 1065 lines call print() against 5 modules importing logging,
    # and the printed output is load-bearing -- DEBUG_PRINT_KEYS=1 is a
    # convention across every ingest script. T-12 converts the failure paths
    # only, deliberately and narrowly. A blanket rule against print() would
    # recommend the wholesale conversion that T-12 exists to refuse.
    "T201",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals, build fixtures inline, and legitimately catch broad
# exceptions to prove a failure path. The three suites are the specification;
# they are not the place to be economical.
#
# S608 is here too, as of T-16, closed in ../TASKS.md -- walked individually
# rather than assumed: all 22 test-file sites splice schema.* table constants
# or a `sql` fragment built by relevance.py's own compiler, and the one test
# reading like a raw INSERT builds its column list from a dict the test itself
# defines two lines above. None takes a table or column name from outside the
# test. Every non-test site got the same walk and a per-line `# noqa: S608`
# naming what it splices, which is why this directory-wide entry exists only
# for tests -- see the commit that closed T-16.
"**/tests/*" = ["S101", "ARG", "BLE001", "B017", "SIM117", "DTZ", "S608"]

# Migrations splice table and schema identifiers into SQL from module-level
# constants -- never from user input. T-16 (../TASKS.md, closed) is the walk
# that established this for every S608 site in the tree; migrations keep the
# per-directory form rather than per-line noqa because every one of the ten
# scripts follows the identical pattern the ADR-0004/T-19 provisioning work
# already describes, and a per-line comment on each would repeat the same
# sentence ten times over.
"migrations/*" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = [
    "lib", "testsupport", "ingest", "tools", "migrations",
    "config", "schema", "relevance", "volume_floors",
]

[tool.ruff.format]
# Not yet run. `ruff format` over 171 files is a single unreviewable diff, which
# is the move this repo is recovering from. It lands as its own commit, after
# the lint baseline has come down, and never in the same commit as a behaviour
# change. Configured here so that when it runs, it runs the same way everywhere.
quote-style = "double"
indent-style = "space"

# mypy configuration. T-17 in ../TASKS.md: "gradual typing on the seams only".
#
# WHY THESE FILES AND NO OTHERS. `files` below is the closed list T-17 names --
# backend/lib/ and schema.py remain the typed seams.
#
# WHY follow_imports = "silent". Every seam file imports untyped siblings --
# schema.py imports lib.*. Without this, mypy would also analyse and report on those files,
# which is the opposite of "on the seams only": it would make the boundary
# everything a seam file happens to import, decided by import graph rather than
# by this row.
[tool.mypy]
python_version = "3.14"
files = [
    "lib",
    "schema.py",
]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
